name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    name: swift-test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [CoreKit, MailProtoKit]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test ${{ matrix.package }}
        run: swift test --package-path packages/${{ matrix.package }}
