name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corekit:
    name: CoreKit · swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test --package-path packages/CoreKit
