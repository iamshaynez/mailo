name: MailoMac
options:
  bundleIdPrefix: com.xiaowenz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  DesignKit:
    path: ../../packages/DesignKit
  AuthKit:
    path: ../../packages/AuthKit
targets:
  MailoMac:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: DesignKit
      - package: AuthKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaowenz.mailo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: false
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        ITSAppUsesNonExemptEncryption: false
